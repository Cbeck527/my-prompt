[package]
name = "my-prompt"
version = "0.0.1"
edition = "2024"
authors = ["Chris Becker <chris@becker.am>"]
description = "My ultra-fast shell prompt based on `prmt` by Ivan Zakharchanka"
license = "MIT"
repository = "https://github.com/cbeck527/my-prompt"
homepage = "https://github.com/cbeck527/my-prompt"
readme = "README.md"
keywords = ["prompt", "shell", "terminal", "cli", "performance"]
categories = ["command-line-utilities", "command-line-interface"]

[lib]
name = "my_prompt"
path = "src/lib.rs"

[[bin]]
name = "my-prompt"
path = "src/main.rs"

[[bench]]
name = "prompt_bench"
harness = false

[[bench]]
name = "comprehensive_bench"
harness = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3"
gix = { version = "0.73", default-features = false, features = ["max-performance-safe", "revision"] }
rayon = "1"
dirs = "6"
memchr = "2"
is-terminal = "0.4"
once_cell = "1"
thiserror = "2"
anyhow = "1"
unicode-width = "0.2"
bitflags = "2"
chrono = "0.4"
toml = "0.8"
whoami = "1.6.1"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
regex = "1"
serial_test = "3"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
