[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]

# MPL-2.0 is accepted only for these locked transitive dependencies.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "uluru@3.1.0" },
]

[bans]
# gix's dependency graph legitimately contains parallel versions. Review
# `cargo tree --duplicates` during dependency updates instead of making every
# policy check emit the same non-actionable warnings.
multiple-versions = "allow"

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Direct dependencies must be maintained. Transitive maintenance notices are
# addressed through the dependencies that select them.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
