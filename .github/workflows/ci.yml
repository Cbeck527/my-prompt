name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native Nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            architecture: aarch64
          - system: aarch64-darwin
            runner: macos-15
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # v21

      - name: Require Cachix write token
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: my-prompt
          authToken: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Evaluate every declared Nix system
        if: runner.os == 'Linux'
        run: nix flake check --accept-flake-config --no-build --all-systems --show-trace

      - name: Build native package and Home Manager activation
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: >-
          nix build --accept-flake-config --no-link --print-build-logs
          ".#packages.${NIX_SYSTEM}.my-prompt"
          ".#checks.${NIX_SYSTEM}.home-manager"

  required:
    name: Required native CI
    if: ${{ always() }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native job
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
