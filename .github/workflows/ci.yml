name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Fish
        shell: bash
        run: |
          set -euo pipefail
          if command -v fish >/dev/null; then
            exit 0
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes fish
          else
            brew install fish
          fi

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build debug profile
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release profile
        run: cargo build --release --locked --verbose

  dependency-policy:
    name: Dependency and Nix policy
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # v21

      - name: Evaluate every declared Nix system
        run: nix flake check --no-build --all-systems

      - name: Build native Nix package and Home Manager check
        run: nix flake check --print-build-logs

      - name: Check dependency policy
        run: nix develop -c cargo deny --locked check

      - name: Audit security advisories
        run: nix develop -c cargo audit

      - name: Check GitHub Actions workflows
        run: nix develop -c actionlint

      - name: Verify dependency-license inventory
        shell: bash
        run: |
          set -euo pipefail
          generated=$(mktemp)
          nix develop -c cargo about generate \
            --format json \
            --locked \
            --fail \
            --output-file "$generated"
          diff -u THIRD_PARTY_LICENSES.json "$generated"

  minimum-supported-rust:
    name: Minimum supported Rust 1.96
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.96.0

      - name: Check minimum supported Rust
        run: cargo check --all-targets --locked --verbose

  required:
    name: Required CI
    if: ${{ always() }}
    needs: [test, dependency-policy, minimum-supported-rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        shell: bash
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.dependency-policy.result }}" = success
          test "${{ needs.minimum-supported-rust.result }}" = success
