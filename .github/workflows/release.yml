name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate release tag to build and validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version-parity:
    name: Verify version parity
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Verify tag matches package version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be an exact vMAJOR.MINOR.PATCH version" >&2
            exit 1
          fi

          manifest_path="$(pwd -P)/Cargo.toml"
          package_version=$(
            cargo metadata --locked --offline --no-deps --format-version 1 |
              jq -er --arg manifest "$manifest_path" '
                .packages
                | map(select(.manifest_path == $manifest))
                | if length == 1 then
                    .[0].version
                  else
                    error("expected exactly one root package")
                  end
              '
          )
          expected_tag="v${package_version}"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release tag $RELEASE_TAG matches package version $package_version"

  quality-gate:
    name: Quality gate
    needs: version-parity
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-linux:
    name: Build ${{ matrix.target }}
    needs: [version-parity, quality-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    env:
      RELEASE_TAG: ${{ needs.version-parity.outputs.release_tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes binutils fish
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then
            sudo apt-get install --yes musl-tools
          fi

      - name: Build locked release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke-test binary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-release.sh \
            "target/$TARGET/release/my-prompt" \
            "${RELEASE_TAG#v}"

      - name: Verify Linux compatibility
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/my-prompt"
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
            max_glibc=$(readelf --version-info "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n 1)
            test -n "$max_glibc"
            newest=$(printf '%s\n' "$max_glibc" GLIBC_2.35 | sort -V | tail -n 1)
            test "$newest" = GLIBC_2.35
          else
            if readelf -l "$binary" | grep -q INTERP; then
              echo "musl release unexpectedly has a dynamic interpreter" >&2
              exit 1
            fi
            if readelf -d "$binary" 2>/dev/null | grep -q NEEDED; then
              echo "musl release unexpectedly has dynamic dependencies" >&2
              exit 1
            fi
          fi

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive_path=$(bash scripts/package-release.sh \
            "target/$TARGET/release/my-prompt" \
            "$RELEASE_TAG" \
            "$TARGET" \
            "$RUNNER_TEMP")
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-macos:
    name: Build, sign, and notarize aarch64-apple-darwin
    needs: [version-parity, quality-gate]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.version-parity.outputs.release_tag }}
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install Fish
        run: brew install fish

      - name: Build locked release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Import Developer ID identity and notary key
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_CERT_P12_BASE64:?missing Developer ID certificate}"
          : "${APPLE_DEVELOPER_ID_CERT_PASSWORD:?missing Developer ID certificate password}"
          : "${APPLE_NOTARY_API_KEY_P8_BASE64:?missing App Store Connect API key}"

          signing_dir="$RUNNER_TEMP/my-prompt-signing"
          keychain="$RUNNER_TEMP/my-prompt-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          certificate="$signing_dir/developer-id.p12"
          api_key="$signing_dir/AuthKey.p8"

          mkdir -m 0700 "$signing_dir"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 -D > "$api_key"
          chmod 0600 "$certificate" "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          identities=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p')
          identity_count=$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$identity_count" -ne 1 ]; then
            echo "expected exactly one Developer ID Application identity, found $identity_count" >&2
            exit 1
          fi

          {
            echo "SIGNING_IDENTITY=$identities"
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "NOTARY_API_KEY=$api_key"
          } >> "$GITHUB_ENV"

      - name: Sign with hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/my-prompt"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY" \
            "$binary"
          codesign --verify --deep --strict --verbose=2 "$binary"
          signature=$(codesign --display --verbose=4 "$binary" 2>&1)
          printf '%s\n' "$signature"
          grep -F 'Authority=Developer ID Application:' <<< "$signature"
          grep -E 'flags=.*runtime' <<< "$signature"
          grep -F 'Timestamp=' <<< "$signature"

      - name: Notarize final signed binary
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_NOTARY_KEY_ID:?missing App Store Connect API key ID}"
          : "${APPLE_NOTARY_ISSUER_ID:?missing App Store Connect issuer ID}"

          binary="target/$TARGET/release/my-prompt"
          submission="$RUNNER_TEMP/my-prompt-notary.zip"
          result="$RUNNER_TEMP/my-prompt-notary-result.json"
          log="$RUNNER_TEMP/my-prompt-notary-log.json"

          ditto -c -k --keepParent "$binary" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$NOTARY_API_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$result"

          jq -e '.status == "Accepted"' "$result"
          submission_id=$(jq -er '.id' "$result")
          xcrun notarytool log "$submission_id" \
            --key "$NOTARY_API_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" > "$log"
          jq empty "$log"
          jq '{id, status, message}' "$result"

          spctl --assess --type execute --verbose=4 "$binary"

      - name: Smoke-test signed binary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-release.sh \
            "target/$TARGET/release/my-prompt" \
            "${RELEASE_TAG#v}"

      - name: Package release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive_path=$(bash scripts/package-release.sh \
            "target/$TARGET/release/my-prompt" \
            "$RELEASE_TAG" \
            "$TARGET" \
            "$RUNNER_TEMP")
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aarch64-apple-darwin
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/my-prompt-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/my-prompt-signing"
          rm -f "$RUNNER_TEMP/my-prompt-notary.zip"

  create-release:
    name: Validate and publish release
    needs: [version-parity, build-linux, build-macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.version-parity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Validate complete archives
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-apple-darwin
          )

          entry_count=$(find artifacts -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          if [ "$entry_count" -ne 3 ]; then
            echo "expected exactly three downloaded release archives" >&2
            exit 1
          fi

          mkdir release-assets
          for target in "${targets[@]}"; do
            archive_name="my-prompt-${RELEASE_TAG}-${target}.tar.gz"
            archive="artifacts/$archive_name"
            directory="my-prompt-${RELEASE_TAG}-${target}"

            if [ ! -f "$archive" ] || [ -L "$archive" ] || [ ! -s "$archive" ]; then
              echo "missing or invalid release archive: $archive_name" >&2
              exit 1
            fi

            actual_entries=$(tar -tzf "$archive" | LC_ALL=C sort)
            expected_entries=$(printf '%s\n' \
              "$directory/" \
              "$directory/LICENSE" \
              "$directory/THIRD_PARTY_LICENSES.html" \
              "$directory/THIRD_PARTY_NOTICES.md" \
              "$directory/my-prompt" | LC_ALL=C sort)
            if [ "$actual_entries" != "$expected_entries" ]; then
              echo "unexpected contents in $archive_name" >&2
              diff -u <(printf '%s\n' "$expected_entries") <(printf '%s\n' "$actual_entries") || true
              exit 1
            fi

            if tar -tvzf "$archive" | awk '$1 !~ /^[-d]/ { bad = 1 } END { exit !bad }'; then
              echo "archive contains a link or unsupported entry type: $archive_name" >&2
              exit 1
            fi

            extraction=$(mktemp -d)
            tar -xzf "$archive" -C "$extraction"
            binary="$extraction/$directory/my-prompt"
            test -s "$binary"
            test -x "$binary"
            cmp LICENSE "$extraction/$directory/LICENSE"
            cmp THIRD_PARTY_NOTICES.md "$extraction/$directory/THIRD_PARTY_NOTICES.md"
            cmp THIRD_PARTY_LICENSES.html "$extraction/$directory/THIRD_PARTY_LICENSES.html"

            if [ "$target" != aarch64-apple-darwin ]; then
              "$binary" --version | grep -Fx "my-prompt ${RELEASE_TAG#v}"
              (cd "$extraction" && NO_COLOR=1 "$binary" --no-color >/dev/null)
            fi

            cp "$archive" "release-assets/$archive_name"
          done

          (
            cd release-assets
            sha256sum ./*.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          release_count=$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$release_count" -eq 4

      - name: Attest release archives
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*.tar.gz

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            release-assets/*.tar.gz \
            release-assets/SHA256SUMS
